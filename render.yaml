# Configuración del backend en Render (New → Blueprint).
services:
  - type: web
    name: estudio-imr-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_CHAIN
        value: gemini:gemini-flash-latest,gemini:gemini-flash-lite-latest,groq:openai/gpt-oss-120b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WEB_MAX_SEARCHES
        value: "3"
